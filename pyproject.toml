[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monguana"
version = "2.0.0"
description = "Browser-based MongoDB manager — pytincture + wapyt"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "OldManGan", email = "eliguana@protonmail.com" }]
dependencies = [
    "pymongo>=4.9",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "uvicorn[standard]>=0.30.0",
    "argon2-cffi>=23.1.0",
    "pytincture",
    "wapyt",
]

[project.urls]
homepage = "https://github.com/El-Iguana/monguana_wapyt"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# Pinned to the tag IguanaXterm was verified against. To work on pytincture
# itself: uv add --editable ../pytincture
pytincture = { git = "https://github.com/pytincture/pytincture.git", tag = "v1.0.0rc10" }
# NOT editable, deliberately: pytincture's widgetset discovery reads
# __widgetset__ from the installed distribution, and an editable install
# exposes only a .pth — the app then boots with `widgetlib: ""` and no
# widgets, silently. Re-run `uv sync --reinstall-package wapyt` after changing
# wapyt's Python wrappers; asset edits go through its scripts/dev_wheel.sh.
wapyt = { path = "../wa_pytincture_widgetset", editable = false }

[tool.setuptools]
py-modules = ["service"]
