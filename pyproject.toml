[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monguana"
version = "2.4.0"
description = "Browser-based MongoDB manager — pytincture + wapyt"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "OldManGan", email = "eliguana@protonmail.com" }]
dependencies = [
    "pymongo>=4.9",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "uvicorn[standard]>=0.30.0",
    "argon2-cffi>=23.1.0",
    "pytincture",
    "wapyt",
    "tinymongo>=1.3.1",
]

[project.optional-dependencies]
# tinymongo's DuckDB and Parquet engines (large native wheels); without these
# the tinymongo backend offers SQLite and JSON only.
duckdb = ["tinymongo[duckdb]>=1.3.1"]
parquet = ["tinymongo[parquet]>=1.3.1"]

[project.urls]
homepage = "https://github.com/El-Iguana/monguana_wapyt"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# The 1.0.0rc13 release tag: #377 (Windows contained reads), the cookie
# namespace and the rc12 service-worker fix. Keep requirements.txt in step.
# To work on pytincture itself:
# uv add --editable ../pytincture
pytincture = { git = "https://github.com/pytincture/pytincture.git", tag = "v1.0.0rc13" }
# Not editable, so development installs what the image and the Windows bundle
# ship: a built wheel. (Before pytincture 1.0.0rc13, #379, it had to be: an
# editable install exposes only a .pth, and discovery then found no widgetset
# and the app booted with no widgets, silently.) Re-run
# `uv sync --reinstall-package wapyt` after changing wapyt's Python wrappers;
# asset edits go through its scripts/dev_wheel.sh.
wapyt = { path = "../wa_pytincture_widgetset", editable = false }

[tool.setuptools]
py-modules = ["service"]
