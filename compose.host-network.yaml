# Monguana on the host's network — Linux only (Docker Engine or Podman).
#
#   docker compose -f compose.host-network.yaml up -d --build
#   podman compose -f compose.host-network.yaml up -d --build
#
# Use this instead of compose.yaml when the MongoDB servers you manage listen
# on this machine's 127.0.0.1 only: with host networking, 127.0.0.1 inside the
# container *is* this machine, so a profile can say host 127.0.0.1. With
# compose.yaml's bridge network, host.docker.internal reaches only services
# listening beyond loopback (INSTALL.md, "MongoDB on the same computer").
#
# Monguana then binds to 127.0.0.2 itself (its own loopback address, so its
# sign-in cookie is not shared with IguanaXterm), so it is still not on the
# network.
# Docker Desktop (Windows, macOS) and Podman machines run containers in a VM,
# where host networking means the VM's network: use compose.yaml there.

name: monguana

services:
  monguana:
    build:
      context: .
      dockerfile: Containerfile
      args:
        # tinymongo engines and backend plugins; see .env.example.
        EXTRA_PACKAGES: ${MONGUANA_EXTRA_PACKAGES:-}
    image: localhost/monguana:latest
    container_name: monguana
    hostname: monguana
    labels:
      app: Monguana
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      MONGUANA_DATA_DIR: /data
      MONGUANA_BIND: ${MONGUANA_HOST:-127.0.0.2}
      PORT: ${MONGUANA_PORT:-8766}
      MONGUANA_CANONICAL_ORIGIN: ${MONGUANA_CANONICAL_ORIGIN:-http://${MONGUANA_HOST:-127.0.0.2}:${MONGUANA_PORT:-8766}}
      MONGUANA_ALLOWED_HOSTS: ${MONGUANA_ALLOWED_HOSTS:-}
    volumes:
      - monguana-data:/data
      # tinymongo stores (INSTALL.md, "tinymongo stores"). To open files from
      # this computer instead, replace with a folder, e.g. ./tinymongo:/tinymongo:z
      - monguana-tinymongo:/tinymongo
    healthcheck:
      test: ["CMD", "python", "manage.py", "health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  monguana-data:
    name: monguana-data
  monguana-tinymongo:
    name: monguana-tinymongo
