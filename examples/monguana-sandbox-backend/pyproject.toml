[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "monguana-sandbox-backend"
version = "0.1.0"
description = "Example Monguana backend plugin: throwaway in-memory databases"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["tinymongo>=1.3.1"]

# What Monguana looks for: the group, a name, and the backend (an object, its
# class, or a function returning one).
[project.entry-points."monguana.backends"]
sandbox = "monguana_sandbox_backend:SandboxBackend"

[tool.setuptools]
py-modules = ["monguana_sandbox_backend"]
